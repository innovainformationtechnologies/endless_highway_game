<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Driving with Combos</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      transition: all 1s ease-in-out;
    }

    canvas {
      display: block;
    }
    #title > h1 {
      font-size: 8vh;
      text-align: center;
    }
    #score, #high_score {
      position: absolute; 
      top: 10px;
      text-align: center;
      width: 100vw;
      font-family: sans-serif;
      font-size: 1.8vh;
      z-index: 10;
    }
    #pause {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
    }
    #tuner {
      position: absolute;
      top: 40px;
      left: 10px;
      color: white;
      background-color: transparent;
      font-family: sans-serif;
      font-size: 2vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: start;
      gap: 1rem;
      & > div {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: start;
        gap: 5rem;
      }
    }

    /* Full-height transparent buttons */
    .control-btn {
      position: absolute;
      top: 0;
      width: 50%;
      /* half screen each */
      height: 100%;
      background: rgba(255, 255, 255, 0);
      /* fully transparent */
      z-index: 10;
      user-select: none;
    }

    /* Arrow icons visible near bottom */
    .control-btn span {
      position: absolute;
      bottom: 20%;
      width: 100%;
      text-align: center;
      font-size: 48px;
      color: white;
      background-color: transparent;
    }
    #controls {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
    }
    #leftBtn {
      left: 0;
      bottom: 50%;
    }

    #rightBtn {
      right: 0;
      bottom: 50%;
    }
    #start_game {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
      border: none;
    }
    #exit {
      position: absolute;
      top: 10%;
      right: 10%;
      z-index: 100;
      color: red;
    }
    .menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: white;
      opacity: 0 !important;
      pointer-events: none;
      &.visible {
        pointer-events: auto;
        position: absolute;
        opacity: 1 !important;
      }
      &>div {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: 5rem;
      }
    }

  </style>
  <script src="audioSystem.js"></script>
</head>

<body>
  <div id="main_menu" class="menu">
    <div id="title">
      <div id="high_score">Score: 0 Combo: 0 Speed: 0</div>
      <h1>Swim Session: Endless Highway</h1>
      <button id="start_game" class="control-btn">Tap to Start</button>
    </div>
  </div>
  <div id="in_game" class="menu">
    <div id="score">Score: 0 Combo: 0 Speed: 0</div>
    <div id="exit"><span>X</span></div>
    <div id="controls">
      <div id="leftBtn" class="control-btn"><span>&#8592;</span></div>
      <div id="rightBtn" class="control-btn"><span>&#8594;</span></div>
    </div>
    <div id="tuner">
        <div>
          <input type="range" min="0" max="1000" value="55"  id="power">
          <span id="power_label">Power</span>
        </div>
        <div>
          <input type="range" min="0" max="300" value="10" id="weight">
          <span id="weight_label">Weight</span>
        </div>
        <div>
          <input type="range" min="0" max="1" value=".5" step=".001" id="friction">
          <span id="friction_label">Friction</span>
        </div>
        <div>
          <input type="range" min="0" max="5" value="1" id="scrape_box_offset">
          <span id="scrape_box_offset_label">Scrape Box Offset</span>
        </div>
        <div>
          <input type="range" min="0" max="10" value="1" id="traffic_density">
          <span id="traffic_density_label">Traffic Density</span>
        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>

</html>
